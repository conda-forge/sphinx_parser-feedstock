schema_version: 1

context:
  name: sphinx_parser
  version: "0.1.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/d7/b3/8ad3f5d0f02f5e1d1e742926ca5cf65f21aba994c019efcd3d0a27e300df/sphinx_parser-${{ version }}.tar.gz
  sha256: 31f0f6b40f4b20eb49c2a57939d3bb69577d1302c81d6f36198998be6ae7a4a8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - numpy >=1.26.4,<2.6.0
    - ase >=3.23.0,<3.30.0
    - h5py >=3.6.0,<3.17.0
    - semantikon >=0.0.17,<1.5.0
    - pint >=0.23,<=0.25.3
    - pyyaml >=5.4.1,<6.1.0

tests:
  - python:
      imports:
        - sphinx_parser
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Parser for the DFT program SPHInX
  description: |
    sphinx_parser is the python input and output parser of the DFT code SPHInX
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/pyiron/sphinx_parser
  repository: https://github.com/pyiron/sphinx_parser
  documentation: https://sphinx_parser.readthedocs.io/

extra:
  recipe-maintainers:
    - jan-janssen
    - samwaseda
    - niklassiemer
